name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          CCSwitch 切换模型后，自动同步 OpenCode。

          本版本支持 Windows、macOS 和 Linux，自动读取 provider、API 地址、模型与推理强度，并使用隔离配置启动 OpenCode。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "CCSwitch OpenCode Launcher $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "CCSwitch OpenCode Launcher $TAG" --generate-notes --notes-file release-notes.md
          fi
