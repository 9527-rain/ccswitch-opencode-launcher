name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile opencode-ccswitch.py
      - run: python -m unittest discover -v
      - run: sh -n install.sh opencode-ccswitch
      - run: ./install.sh --help

  powershell:
    runs-on: windows-latest
    env:
      CCSWITCH_SQLITE: ${{ github.workspace }}\tests\sqlite3-shim.cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify SQLite shim
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CCSWITCH_SQLITE=$env:CCSWITCH_SQLITE"
          if (-not (Test-Path -LiteralPath $env:CCSWITCH_SQLITE)) { throw "SQLite shim not found" }
          & $env:CCSWITCH_SQLITE -readonly -json -noheader ':memory:' 'SELECT 1 AS value;'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell syntax and version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\opencode-ccswitch.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object Message; exit 1 }
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object Message; exit 1 }
          & .\opencode-ccswitch.ps1 --version
      - name: Run Windows integration test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
