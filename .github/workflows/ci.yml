name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile opencode-ccswitch.py
      - run: python -m unittest discover -v
      - run: sh -n install.sh opencode-ccswitch
      - run: ./install.sh --help

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: |
          $env:CCSWITCH_SQLITE = Join-Path $env:RUNNER_TEMP 'sqlite3.cmd'
          $shim = (Resolve-Path .\tests\sqlite3-shim.py).Path
          $shimCommand = "@echo off`r`npython `"$shim`" %*`r`n"
          Set-Content -LiteralPath $env:CCSWITCH_SQLITE -Value $shimCommand -Encoding ASCII
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\opencode-ccswitch.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object Message; exit 1 }
          & .\opencode-ccswitch.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\install.ps1 -? | Out-Null
          & .\tests\windows-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object Message; exit 1 }
