name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile opencode-ccswitch.py
      - run: python -m unittest discover -v
      - run: sh -n install.sh opencode-ccswitch
      - run: ./install.sh --help

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $sqliteZip = Join-Path $env:RUNNER_TEMP 'sqlite-tools.zip'
          $sqliteDir = Join-Path $env:RUNNER_TEMP 'sqlite-tools'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.sqlite.org/2025/sqlite-tools-win-x64-3500100.zip' -OutFile $sqliteZip
          Expand-Archive -LiteralPath $sqliteZip -DestinationPath $sqliteDir -Force
          $env:PATH = "$sqliteDir;$env:PATH"
          $env:CCSWITCH_SQLITE = (Get-ChildItem -LiteralPath $sqliteDir -Filter sqlite3.exe -Recurse | Select-Object -First 1).FullName
          if (-not $env:CCSWITCH_SQLITE) { throw 'sqlite3.exe was not found in the SQLite tools archive' }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\opencode-ccswitch.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object Message; exit 1 }
          & .\opencode-ccswitch.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\install.ps1 -? | Out-Null
          & .\tests\windows-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object Message; exit 1 }
